<style>
/* ==================== مدرّبي — نظام التصميم 3 ====================
   لون مميز واحد (ليموني) فوق ألوان محايدة. التفريق بين الأشياء بالمسافات والوزن الخطي، مو بالإطارات. */
:root{
  --f-ui:"Tajawal","Segoe UI",Tahoma,sans-serif;
  --f-disp:"Lalezar","Tajawal",sans-serif;
  --f-num:"Barlow Condensed","Tajawal",sans-serif;
  --bg:#F2F2F0;--s1:#FFFFFF;--s2:#ECECE9;--s3:#D9D9D5;
  --ink:#0F0F11;--mut:#5B5B63;--dim:#6C6C75;--line:rgba(15,15,17,.08);
  --acc:#C6F135;--on-acc:#0A0A0B;--acc-ink:#466900;--warn:#A86A00;--bad:#CF3737;
  --sh:0 0 0 1px rgba(15,15,17,.04);
  --r1:10px;--r2:14px;--r3:18px;--ease:cubic-bezier(.2,.8,.2,1);
  /* أسماء قديمة تستخدمها قوالب الجافاسكربت: كلها تتبع اللون الواحد */
  --surface:var(--s1);--surface2:var(--s2);--muted:var(--mut);
  --iron:var(--acc-ink);--iron-ink:var(--acc-ink);--rest:var(--acc-ink);--rest-ink:var(--acc-ink);
  --cardio:var(--ink);--cardio-ink:var(--ink);--flame:var(--warn);--flame-ink:var(--warn);
  --hero:var(--s1);--hero2:var(--s2);--hero-ink:var(--ink);--hero-muted:var(--mut);
  --p-red:#D23B3B;--p-blue:#3B6BE0;--p-yellow:#E4AE00;--p-green:#2E9E5B;--p-white:#E9E9E6;
  --steel:#55595F;--steel-hi:#A0A6AE;--pad:#232427;--pad-edge:#000;--stack:#3B3E44;--shade:rgba(15,15,17,.12);--bodyn:var(--s2);
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0A0B;--s1:#141416;--s2:#1D1D20;--s3:#2B2B2F;--ink:#F2F2F3;--mut:#A3A3AB;--dim:#8B8B93;--line:rgba(255,255,255,.07);
  --acc-ink:#C6F135;--warn:#F2B13A;--bad:#FF6A6A;--sh:none;
  --steel:#B3B8C0;--steel-hi:#E6E8EC;--pad:#0D0E10;--pad-edge:#4A4D53;--stack:#55595F;--shade:rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0A0B;--s1:#141416;--s2:#1D1D20;--s3:#2B2B2F;--ink:#F2F2F3;--mut:#A3A3AB;--dim:#8B8B93;--line:rgba(255,255,255,.07);
  --acc-ink:#C6F135;--warn:#F2B13A;--bad:#FF6A6A;--sh:none;
  --steel:#B3B8C0;--steel-hi:#E6E8EC;--pad:#0D0E10;--pad-edge:#4A4D53;--stack:#55595F;--shade:rgba(0,0,0,.5);color-scheme:dark}
:root[lang="en"]{--f-disp:"Barlow Condensed","Tajawal",sans-serif}

/* ---------- أساس ---------- */
*,*::before,*::after{box-sizing:border-box;touch-action:manipulation}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
input,select,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
h1,h2,h3,p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc-ink);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:8px 16px calc(112px + var(--badge-h,0px))}
.wrap{min-height:calc(100vh + 1px);box-sizing:border-box}   /* الآيفون يرفع الشريط السفلي لما الصفحة أقصر من الشاشة: كل صفحة بطول الشاشة على الأقل */
body.has-bar .wrap{padding-bottom:calc(190px + var(--badge-h,0px))}
.muted{color:var(--mut)}
.num{font-family:var(--f-num);font-weight:700;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block;font-size:1.15em;line-height:1;letter-spacing:.01em}
.hint{font-size:13px;color:var(--mut);margin-top:8px;line-height:1.55}
.err{color:var(--bad);font-size:13.5px;min-height:1.5em}
.foot{text-align:center;color:var(--dim);font-size:12px;margin:36px 0 0;line-height:1.7}
.sec-t{font:700 13px/1.4 var(--f-ui);color:var(--mut);margin:22px 2px 8px}
[lang="en"] .sec-t{text-transform:uppercase;letter-spacing:.06em;font-size:12px}
button{transition:transform .12s var(--ease),background-color .15s,color .15s,opacity .15s}
button:active{transform:scale(.97)}

/* ---------- رأس الصفحة ---------- */
.top{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.top .logo{display:none}
.top .t{flex:1;min-width:0}
.top h1{font:400 26px/1.15 var(--f-disp)}
[lang="en"] .top h1,[lang="en"] .hero h2,[lang="en"] .fname,[lang="en"] .celebrate h1,[lang="en"] .hello h1{font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.top .sub{font-size:13px;color:var(--mut);margin-top:2px}
.streak{flex:none;display:flex;align-items:center;gap:5px;padding:7px 12px;border-radius:999px;background:var(--s1);box-shadow:var(--sh)}
.streak svg{width:16px;height:16px}
.streak b{font:700 20px/1 var(--f-num)}
.logo{flex:none;width:44px;height:44px;border-radius:12px;display:block}

/* ---------- تنبيهات (صف واحد لكل تنبيه) ---------- */
.alerts{display:grid;gap:8px;margin-bottom:12px}
.al{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-radius:var(--r2);background:var(--s1);box-shadow:var(--sh)}
.al .ad{flex:none;width:8px;height:8px;border-radius:50%;background:var(--warn)}
.al .at{flex:1;min-width:0;line-height:1.35}
.al .at b{display:block;font:600 13.5px/1.35 var(--f-ui)}
.al .at small{display:block;font-size:12px;color:var(--mut)}
.al .ab{position:relative;flex:none;min-height:36px;padding:6px 14px;border:0;border-radius:999px;background:var(--acc);color:var(--on-acc);font:700 13px var(--f-ui)}
.al .ab::after,.xi.cc .cbtn::after{content:"";position:absolute;inset:-5px -4px}
.al .aq{flex:none;min-width:44px;min-height:44px;border:0;background:none;color:var(--mut);font:600 13px var(--f-ui)}
.al .ax{flex:none;min-width:44px;min-height:44px;border:0;background:none;color:var(--dim);font-size:18px}
.alx{padding:2px 14px 8px 14px;margin:-6px 0 2px;font-size:12.5px;color:var(--mut);line-height:1.8}

/* ---------- ملخص الأسبوع ---------- */
.weekbox{background:var(--s1);border-radius:var(--r3);padding:14px 14px 12px;margin-bottom:12px;box-shadow:var(--sh)}
.weekbox .wh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.weekbox .wh b{font:700 15px var(--f-ui)}.weekbox .wh span{font-size:13px;color:var(--mut)}
.wkbar{width:100%;height:auto;max-height:50px;display:block;margin:0 0 6px}
.wkm{display:flex;flex-wrap:wrap;gap:4px 20px;margin:0 0 12px;font-size:12.5px;color:var(--mut)}
.wkm span{display:inline-flex;align-items:baseline;gap:6px}
.wkm b{font:700 19px/1 var(--f-num);color:var(--ink)}
.wkn{margin:-4px 0 12px;font-size:12.5px;color:var(--mut);display:flex;align-items:center;gap:8px}
.wkn .plate{width:22px;height:22px}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.strip>div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--dim);box-shadow:inset 0 0 0 1.5px var(--s3)}
.dot svg{width:15px;height:15px}
.dot.done{background:var(--acc);color:var(--on-acc);box-shadow:none}
.dot.away{box-shadow:none;border:1.5px dashed var(--s3)}
.dot.miss{box-shadow:none;border:1.5px dashed var(--dim);color:var(--dim)}
.strip .today{color:var(--ink);font-weight:700}
.strip .today .dot:not(.done){box-shadow:inset 0 0 0 2px var(--ink);color:var(--ink)}
.pl{animation:plateIn .5s var(--ease) both}
@keyframes plateIn{from{opacity:0;transform:translateX(var(--dx))}}

/* ---------- بطاقة التمرين الرئيسية ---------- */
.hero{background:var(--s1);border-radius:var(--r3);padding:16px;margin-bottom:12px;box-shadow:var(--sh);position:relative}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.badge{display:inline-flex;align-items:center;gap:6px;font:700 12px/1.4 var(--f-ui);color:var(--acc-ink);padding:0;background:none}
.badge svg{width:15px;height:15px}
.hero-top small{font-size:12.5px;color:var(--mut)}
.hero h2{font:400 26px/1.2 var(--f-disp);margin-bottom:4px}
.mline{font-size:13px;color:var(--mut);margin-bottom:12px}
.hero p{color:var(--mut);font-size:13.5px;line-height:1.6}
.hstats{display:flex;gap:26px;margin:2px 0 12px}
.hstats div{display:flex;flex-direction:column;gap:2px;line-height:1.1}
.hstats b{font:700 26px/1 var(--f-num)}
.hstats span{font-size:12px;color:var(--mut)}
.tipline{display:flex;gap:8px;align-items:flex-start;margin:0 0 14px;font-size:13px;line-height:1.6;color:var(--mut)}
.tipline::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--acc);margin-top:8px}
.tipline b{color:var(--ink);font-weight:600}
.elapsed{display:flex;justify-content:space-between;align-items:center;margin:2px 0 10px;font-size:13px;color:var(--mut)}
.elapsed b{font:700 20px/1 var(--f-num);color:var(--ink)}
.hprog{margin:0 0 12px}
.hprog .lbl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin-bottom:6px}
.hprog .trk{height:4px;border-radius:2px;background:var(--s3);overflow:hidden}
.hprog .trk i{display:block;height:100%;background:var(--acc);border-radius:2px;transition:width .3s}
.hero .big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.hero .big b{font:700 52px/1 var(--f-num)}
.hero .big span{color:var(--mut);font-size:13px}
.steps{list-style:none;margin:6px 0 12px;padding:0}
.steps li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.steps li span{color:var(--mut);font-size:13px}
.hphoto{margin:8px 0 10px;border-radius:var(--r2);overflow:hidden;background:#111}
.hero .link{padding:0 8px;min-height:44px}
.per{font-size:12px;color:var(--mut);text-align:center}
.bar{width:100%;height:auto;display:block;margin:10px 0 2px}

/* ---------- قائمة التمارين ---------- */
.xlist{background:var(--s1);border-radius:var(--r3);overflow:hidden;box-shadow:var(--sh)}
.xi{border-top:1px solid var(--line)}
.xi:first-child{border-top:0}
.xh{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;min-height:64px;cursor:pointer}
.xh:focus-visible{outline:2px solid var(--acc-ink);outline-offset:-2px}
.xn{flex:none;width:22px;text-align:center;font:700 16px/1 var(--f-num);color:var(--dim)}
.xi.complete .xn{color:var(--acc-ink)}
.xph{flex:none;width:56px;height:42px;border-radius:10px;overflow:hidden;background:#111;position:relative;display:grid;place-items:center}
.xph .eq{width:50px;height:34px}
.xph .zoomhint{display:none}
.xt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.xt b{font:600 15px/1.35 var(--f-ui)}
.xt small{font-size:12.5px;color:var(--mut);line-height:1.3}
.xs{flex:none;font:700 15px/1 var(--f-num);color:var(--mut)}
.xi.complete .xs{color:var(--acc-ink)}
.xi.open{background:var(--s2)}
.ctag{display:inline-block;margin-inline-end:6px;padding:0 8px;border-radius:999px;background:var(--acc);color:var(--on-acc);font:700 11px/1.7 var(--f-ui)}
.xb{padding:2px 14px 14px}
.xb .xbig{margin:0 0 10px;border-radius:var(--r2);overflow:hidden;background:#111}
.xb .xbig .ph{aspect-ratio:16/10;height:auto}
.xb .xm{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px;color:var(--mut)}
.xi.cc .xh{cursor:default}
.xi.cc .cbtn{position:relative;flex:none;min-height:40px;padding:8px 16px;border:0;border-radius:999px;background:var(--acc);color:var(--on-acc);font:700 13px var(--f-ui)}
.xi.cc.complete .cbtn{background:var(--s3);color:var(--ink)}

.wrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px;padding:6px;border-radius:var(--r2);background:var(--s1)}
.wrow .wv{text-align:center;line-height:1.1}
.wrow .wv b{font:700 34px/1 var(--f-num)}
.wrow .wv small{display:block;font-size:12px;color:var(--mut);margin-top:3px}
.ib{width:46px;height:46px;border-radius:12px;border:0;background:var(--s2);font:600 22px/1 var(--f-ui);display:grid;place-items:center;padding:0}
.last{margin-top:8px;font-size:12.5px;color:var(--mut)}
.last b{color:var(--ink);font-weight:600}
.warm{margin-top:10px;font-size:12.5px;color:var(--mut)}
.warm b{color:var(--ink);font-weight:600}
.warm .wl{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.warm .wl span{background:var(--s1);border-radius:8px;padding:2px 9px;font-size:14px}
.cue{margin-top:10px;padding:10px 12px;border-radius:var(--r2);background:var(--s1);font-size:13.5px;line-height:1.75;color:var(--mut)}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.set{width:52px;height:52px;border-radius:14px;border:0;background:var(--s1);font:700 20px/1 var(--f-num);display:grid;place-items:center;padding:0}
.xi.open .set{background:var(--s1)}
.set.on{background:var(--acc);color:var(--on-acc);animation:setPop .3s var(--ease)}
@keyframes setPop{40%{transform:scale(1.1)}}
.ex-f{margin-top:12px}
.rate-q{font-size:13px;color:var(--mut);margin-bottom:8px}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rate button{min-height:44px;border:0;border-radius:12px;background:var(--s1);font:600 13.5px/1.3 var(--f-ui);padding:6px 4px}
.rate button.on{background:var(--acc);color:var(--on-acc)}

/* ---------- أزرار ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding:12px 16px;border:0;border-radius:14px;background:var(--ink);color:var(--bg);font:700 15px/1.3 var(--f-ui);margin-top:10px}
.btn.iron,.btn.cardio,.btn.light{background:var(--acc);color:var(--on-acc)}
.btn.ghost{background:var(--s2);color:var(--ink)}
.btn.danger{background:var(--s2);color:var(--bad)}
.link{background:none;border:0;color:var(--acc-ink);font:600 14px/1.3 var(--f-ui);padding:0 4px;min-height:44px;display:inline-flex;align-items:center}
.awaybtn{display:flex;margin:0 auto 6px;color:var(--mut);font-weight:500}

/* ---------- بطاقات عامة ---------- */
.card{background:var(--s1);border-radius:var(--r3);padding:14px;margin-bottom:10px;box-shadow:var(--sh)}
.card h3{font:700 15px/1.4 var(--f-ui);margin-bottom:6px}
[lang="en"] .card h3{text-transform:uppercase;letter-spacing:.05em;font-size:13px}
.card p{line-height:1.65}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.45}
.kv:first-of-type{border-top:0}
.kv span{color:var(--mut)}
.kv b{font-weight:600}
.vh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.vh b{font-weight:700}
.vtrk{position:relative;height:6px;border-radius:3px;background:var(--s3);overflow:hidden;margin-top:6px}
.vtrk .zone{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--acc) 38%,transparent)}
.vtrk .val{position:absolute;top:0;bottom:0;inset-inline-start:0;border-radius:3px}
.vrow{padding:7px 0}
.lgauge{position:relative;display:flex;height:8px;border-radius:4px;margin-top:10px;direction:ltr}
.lgauge i{display:block;height:100%}.lgauge i:first-child{border-radius:4px 0 0 4px}.lgauge i:nth-child(4){border-radius:0 4px 4px 0}
.lgauge b{position:absolute;top:-5px;width:3px;height:18px;border-radius:2px;background:var(--ink);transform:translateX(-1.5px)}

/* ---------- جدولي ---------- */
.wday{background:var(--s1);border-radius:var(--r2);margin-bottom:6px;overflow:hidden;box-shadow:var(--sh)}
.wday>button{all:unset;box-sizing:border-box;display:flex;width:100%;align-items:center;gap:12px;padding:10px 14px;min-height:56px;cursor:pointer}
.wday>button:focus-visible{outline:2px solid var(--acc-ink);outline-offset:-2px}
.wday .ic{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--s2);color:var(--dim)}
.wday .ic.iron,.wday .ic.cardio{color:var(--acc-ink)}
.wday .ic svg{width:18px;height:18px}
.wday .dn{flex:1;min-width:0;line-height:1.4}
.wday .dn b{display:block;font:600 15px var(--f-ui)}
.wday .dn small{color:var(--mut);font-size:12.5px}
.wday .ok{color:var(--acc-ink);font-weight:800}
.wday .det{padding:0 14px 10px}
.wday.is-today{box-shadow:inset 0 0 0 1.5px var(--ink)}
.awayrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.rowbtn{display:flex;width:100%;align-items:center;gap:10px;min-height:56px;padding:10px 14px;border:0;border-radius:var(--r2);background:var(--s1);text-align:start;box-shadow:var(--sh);margin-bottom:10px;color:var(--ink)}
.rowbtn .rt{flex:1;line-height:1.35}.rowbtn .rt b{display:block;font:600 14.5px var(--f-ui)}.rowbtn .rt small{font-size:12.5px;color:var(--mut)}
.rowbtn .chev{color:var(--dim);font-size:20px;transition:transform .2s}.rowbtn[aria-expanded="true"] .chev{transform:rotate(90deg)}
.chip.ax{background:var(--s3)}

/* ---------- تقدّمي ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--s1);border-radius:var(--r2);padding:12px 6px;text-align:center;box-shadow:var(--sh);line-height:1.25}
.stat b{display:block;font:700 30px/1 var(--f-num)}
.stat span{display:block;font-size:11.5px;color:var(--mut);margin-top:4px}
.prow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.card .prow:nth-of-type(1){border-top:0}
.prow .pn{flex:1;min-width:0;font-size:14px;line-height:1.4}
.prow .pn small{display:block;font-size:12.5px;color:var(--mut)}
.prow .pw{text-align:end;line-height:1.3;white-space:nowrap;font-size:13px}
.prow .pw b{font:700 22px/1 var(--f-num)}
.prow .pw small{display:block;font-size:12.5px}
.up{color:var(--acc-ink)}.down{color:var(--bad)}
.bwrow{display:flex;gap:8px;margin-top:10px}
.bwrow .inp{flex:1}
.bwrow .btn{width:auto;margin:0;padding:12px 20px}
.mstone{display:flex;align-items:center;gap:12px;background:var(--s1);border-radius:var(--r3);padding:12px 14px;margin-bottom:10px;box-shadow:var(--sh)}
.mstone .mt{display:flex;flex-direction:column;line-height:1.45}
.mstone .mt span,.mstone .mt small{font-size:12.5px;color:var(--mut)}
.mstone .mt b{font:700 15px var(--f-ui)}
.goal .gnum{display:flex;align-items:baseline;gap:8px;margin:6px 0 2px}
.goal .gnum b{font:700 44px/1 var(--f-num);color:var(--ink)}
.goal .gnum span{color:var(--mut)}
.achs{display:grid}
.ach2{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.ach2:first-child{border-top:0}
.ach2 .ab{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.4}
.ach2 .ab small{font-size:12px;color:var(--mut)}
.ach2 .ab b{font:700 15px var(--f-ui)}
.ach2 .ab .vtrk{margin:6px 0 4px}
.ach2 .ab span{font-size:12.5px;color:var(--mut)}
.plate{flex:none;display:block}
.bodies{display:flex;justify-content:center;gap:8px;margin:6px 0 10px}
.bodies figure{margin:0;flex:1;text-align:center}
.bodies svg{height:290px;width:auto;max-width:100%;display:block;margin:0 auto}
.bodies figcaption{font-size:12px;color:var(--mut);margin-top:2px}
.mlist{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:12px 0 4px}
.mlist div{display:flex;align-items:center;gap:8px;font-size:13.5px;line-height:1.35}
.mlist i{flex:none;width:8px;height:8px;border-radius:50%}
.mlist span{flex:1}
.mlist small{color:var(--mut);font-size:12px}
.rleg2{display:flex;justify-content:center;gap:16px;font-size:12px;color:var(--mut)}
.rleg2 span{display:flex;align-items:center;gap:6px}
.rleg2 i{width:9px;height:9px;border-radius:50%}

/* ---------- نماذج ---------- */
.hello{position:relative;text-align:center;padding:14px 0 20px}
.hello .logo{display:block;width:76px;height:76px;border-radius:20px;margin:0 auto 10px}
.hello h1{font:400 34px/1.2 var(--f-disp)}
.hello p{color:var(--mut);font-size:14px;line-height:1.65;margin-top:6px}
.langsw{position:absolute;top:0;inset-inline-end:0;min-height:44px;padding:4px 14px}
.field{margin-bottom:18px}
.field>label,.field>.lbl,.lbl{display:block;font:600 13px/1.4 var(--f-ui);color:var(--mut);margin-bottom:8px}
.fld{display:block;font-size:12.5px;color:var(--mut);margin:10px 0 4px}
.inp{width:100%;min-height:48px;padding:10px 14px;border:0;border-radius:12px;background:var(--s2);color:var(--ink);font:400 16px/1.4 var(--f-ui)}
.inp::placeholder{color:var(--dim)}
.inp:focus{outline:none;box-shadow:0 0 0 2px var(--acc-ink)}
select.inp{appearance:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 16px;border:0;border-radius:14px;background:var(--s2);color:var(--ink);font:600 14px/1.3 var(--f-ui)}
.chip small{display:block;font-size:11.5px;font-weight:400;color:var(--mut);margin-top:1px}
.chip.on{background:var(--acc);color:var(--on-acc)}
.chip.on small{color:var(--on-acc);opacity:.7}
.chip[disabled]{opacity:.35}
.chip.exd.on{background:color-mix(in srgb,var(--bad) 22%,var(--s2));color:var(--bad);text-decoration:line-through}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- شريط التبويبات ---------- */
.tabs{position:fixed;left:0;right:0;bottom:var(--badge-h,0px);background:var(--bg);box-shadow:0 -1px 0 var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:18;pointer-events:none}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{background:none;border:0;min-height:52px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font:600 11px/1.2 var(--f-ui);color:var(--dim)}
.tabs button.on{color:var(--acc-ink)}
.tabs svg{width:23px;height:23px}

/* ---------- نوافذ ---------- */
.ov{position:fixed;inset:0;z-index:50;display:none;background:rgba(0,0,0,.66)}
.ov.show{display:flex}
.sheet{margin:auto auto 0;width:100%;max-width:560px;background:var(--s1);color:var(--ink);border-radius:22px 22px 0 0;padding:22px 18px calc(18px + var(--badge-h,0px) + env(safe-area-inset-bottom,0px));text-align:center}
.ov.show .sheet{animation:sheetUp .32s var(--ease)}
.ov.show .full{animation:popIn .28s var(--ease)}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}}
@keyframes popIn{from{transform:scale(.95);opacity:0}}
.sheet .lbl{color:var(--mut);font-size:14px;margin:0}
.sheet .t{font:700 84px/1 var(--f-num);margin:6px 0}
.sheet .nx{color:var(--mut);font-size:13.5px;margin-bottom:6px}
.sheet .row{display:flex;gap:10px;margin-top:12px}
.sheet .row .btn{margin-top:0}
.sheet .row.col{flex-direction:column}
.phase{font:400 22px/1.3 var(--f-disp)}
.dtxt{font-size:15.5px;line-height:1.75;margin:2px 0 16px}
#dlgOv{z-index:80}
.feel{display:grid;gap:8px}
.feel button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:60px;padding:12px 16px;border:0;border-radius:var(--r2);background:var(--s2);text-align:start;line-height:1.4}
.feel button b{font:700 16px var(--f-ui)}
.feel button b .num{color:var(--acc-ink);margin-inline-end:6px}
.feel button span{font-size:13px;color:var(--mut)}
.full{width:100%;max-width:560px;margin:auto;padding:20px;text-align:center}
.tmbox{background:var(--s1);color:var(--ink);border-radius:26px;padding:28px 20px}
.ring{font:700 112px/1 var(--f-num);margin:8px 0}
.tmbox.work .ring,.tmbox.work .phase{color:var(--acc-ink)}
.tmbox .muted{color:var(--mut)}
.prog{height:5px;border-radius:3px;background:var(--s3);overflow:hidden;margin:14px 0}
.prog i{display:block;height:100%;background:var(--acc);transition:width .3s}
.celebrate h1{font:400 34px/1.2 var(--f-disp);margin:8px 0 4px}
.cflame{display:block;width:64px;height:64px;margin:0 auto}
.celebrate .pr{display:inline-block;margin-top:10px;padding:6px 14px;border-radius:999px;background:var(--acc);color:var(--on-acc);font-weight:700;font-size:13.5px}
.newach{display:flex;align-items:center;gap:12px;text-align:start;margin-top:10px;padding:8px 12px;border-radius:var(--r2);background:var(--s2);font-weight:600;line-height:1.5}
.newach .plate{width:44px;height:44px}
.newach small{font-weight:400;color:var(--mut)}
#zoomOv{z-index:60;background:rgba(8,8,9,.94);align-items:center;justify-content:center;cursor:zoom-out}
.zbox{width:100%;max-width:640px;padding:16px;text-align:center}
.zbox .ph.zbig{aspect-ratio:4/3;height:auto;border-radius:var(--r3)}
.zcap{color:#F2F2F3;font:400 22px/1.3 var(--f-disp);margin-top:14px}
.zhint{color:#9E9EA6;font-size:12.5px;margin-top:4px}

/* ---------- الشريط العائم ووضع التركيز ---------- */
.sbar{position:fixed;left:0;right:0;bottom:calc(56px + var(--badge-h,0px) + env(safe-area-inset-bottom,0px));z-index:19;padding:0 12px}
.sbar>div{max-width:536px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;border-radius:var(--r3);background:var(--s2);box-shadow:0 8px 28px rgba(0,0,0,.28)}
.sbar .sp{flex:1;min-width:0;line-height:1.3}
.sbar .sp b{font:700 22px/1 var(--f-num)}
.sbar .sp small{display:block;font-size:12px;color:var(--mut)}
.sbar .btn{width:auto;margin:0;min-height:44px;padding:8px 18px;font-size:14px}
#focusOv{z-index:45;background:var(--bg);backdrop-filter:none}
#focusOv.show{display:block;overflow-y:auto}
.fbox{max-width:560px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(22px + var(--badge-h,0px) + env(safe-area-inset-bottom,0px));min-height:100%;display:flex;flex-direction:column}
.fhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fhead .x{width:44px;height:44px;border-radius:50%;border:0;background:var(--s1);font-size:20px}
.fhead span{font-size:13.5px;color:var(--mut)}
.fseg{display:flex;gap:4px;margin:10px 0 16px}
.fseg i{flex:1;height:4px;border-radius:2px;background:var(--s3)}
.fseg i.done{background:var(--mut)}.fseg i.cur{background:var(--acc)}
.fart{border-radius:var(--r3);background:var(--s1);display:grid;place-items:center;padding:14px}
.fart.phw{padding:0;overflow:hidden;background:#111}
.fart .eq{width:min(240px,70vw);height:auto}
.fname{font:400 28px/1.2 var(--f-disp);margin-top:16px}
.fmeta{color:var(--mut);font-size:14px;margin-top:2px}
.fw{display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding:8px;border-radius:var(--r3);background:var(--s1)}
.fw .ib{width:56px;height:56px;font-size:26px}
.fw .wv{text-align:center;line-height:1}
.fw .wv b{font:700 60px/1 var(--f-num)}
.fw .wv small{display:block;font-size:12.5px;color:var(--mut);margin-top:6px}
.fsets{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:10px;margin-top:16px}
.fsets .set{width:auto;height:66px;font-size:26px;border-radius:16px;background:var(--s1)}
.fnav{display:flex;gap:10px;margin-top:auto;padding-top:18px}
.fnav .btn{margin:0}

/* ---------- المحرك البصري للأجهزة والصور ---------- */
.eq .f{fill:none;stroke:var(--steel);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.eq .s{fill:none;stroke:var(--mut);stroke-width:2;stroke-linecap:round}
.eq .a{fill:var(--acc)}.eq .b{fill:var(--ink)}
.eq .p{fill:var(--pad);stroke:var(--pad-edge);stroke-width:1.2}
.eq .sh{fill:var(--shade)}.eq .stk{fill:var(--stack)}.eq .pin{fill:var(--acc)}
.eq .hl{stroke:var(--steel-hi);stroke-width:1.2;fill:none;stroke-linecap:round}
.ph{position:relative;width:100%;height:100%;overflow:hidden;border-radius:inherit;background:#111;isolation:isolate}
.ph img{position:absolute;inset:-1px;width:calc(100% + 2px);height:calc(100% + 2px);object-fit:cover;transform:translateZ(0);backface-visibility:hidden}
.ph .b{animation:phx 2.8s ease-in-out infinite}
@keyframes phx{0%,35%{opacity:0}50%,85%{opacity:1}100%{opacity:0}}
.ph.big{aspect-ratio:4/3;height:auto}
.ph[data-act="zoom"]{cursor:zoom-in}
.zoomhint{position:absolute;bottom:6px;inset-inline-end:6px;width:22px;height:22px;border-radius:7px;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:3;pointer-events:none}

/* ---------- التغذية ---------- */
.hero.nut .macs{display:grid;gap:10px;margin:12px 0 4px}
.mac .mh{display:flex;justify-content:space-between;font-size:14px}
.mac .mh b{font-weight:700}
.mac small{color:var(--mut);font-size:12px}
.nrate{margin-top:10px;color:var(--mut);font-size:13.5px;text-align:center}
.nrate .num{color:var(--ink)}
.dpills{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.dpills::-webkit-scrollbar{display:none}
.dp{flex:1 0 auto;min-width:48px;min-height:44px;padding:6px 10px;border:0;border-radius:var(--r2);background:var(--s1);font:600 14px var(--f-ui)}
.dp.on{background:var(--ink);color:var(--bg)}
.dp.tod:not(.on){box-shadow:inset 0 0 0 1.5px var(--acc-ink)}
.meal{background:var(--s1);border-radius:var(--r3);padding:14px;margin-bottom:10px;box-shadow:var(--sh)}
.meal .mt{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.meal .mt small{font-size:12px;color:var(--mut)}
.meal .mt h3{font:700 15px/1.45 var(--f-ui)}

<script>
/* ============ اللغة ============ */
let LANG=(()=>{try{const x=JSON.parse(localStorage.getItem('madrabi_v1')||'{}');return x.lang||'ar'}catch(e){return'ar'}})();
const T=(ar,en)=>LANG==='en'?en:ar;
const DICT={"مدرّبي": "Madrabi", "اليوم": "Today", "جدولي": "Plan", "تقدّمي": "Progress", "ملفي": "Profile", "راحة": "Rest", "ثانية": "sec", "جاهز": "Ready", "إيقاف مؤقت": "Pause", "إنهاء": "Finish", "شدة الجلسة: كم كان جهدك؟": "Session intensity: how hard was it?", "من 10، وعلى جوابك أحدد شدة التمارين الجاية": "Out of 10. Your answer sets the intensity of the next workouts", "سهل": "Easy", "كان عندي طاقة كثير": "Plenty of energy left", "متوسط": "Moderate", "مريح بس فيه جهد": "Comfortable but some effort", "صعب": "Hard", "تعبت بس كمّلت زين": "Tired but finished well", "صعب جدًا": "Very hard", "بالكاد كمّلت": "Barely made it", "رجوع للتمرين": "Back to workout", "الأحد": "Sunday", "الاثنين": "Monday", "الثلاثاء": "Tuesday", "الأربعاء": "Wednesday", "الخميس": "Thursday", "الجمعة": "Friday", "السبت": "Saturday", "أحد": "Sun", "اثنين": "Mon", "ثلاثاء": "Tue", "أربعاء": "Wed", "خميس": "Thu", "جمعة": "Fri", "سبت": "Sat", "سكوات بالبار": "Barbell squat", "أفخاذ وأرداف": "Quads & glutes", "البار على أعلى الظهر، القدمين بعرض الكتفين. انزل كأنك تجلس على كرسي حتى يصير الفخذ موازي للأرض، والركب باتجاه أصابع القدم. اطلع بدفع الأرض بكامل القدم": "Bar on your upper back, feet shoulder-width. Sit down as if onto a chair until your thighs are parallel to the floor, knees tracking over your toes. Drive up through your whole foot", "سكوات أمامي بالبار": "Barbell front squat", "أفخاذ أمامية": "Front thighs", "البار على مقدمة الكتفين والكوعين مرفوعة للأمام. خل جذعك مستقيم أكثر من السكوات العادي وانزل بتحكم": "Bar on the front of your shoulders, elbows high. Keep your torso more upright than a regular squat and lower with control", "ضغط الأرجل بالجهاز": "Leg press machine", "ظهرك ملتصق بالمقعد. انزل حتى تصير الركبة بزاوية قائمة تقريبًا، ولا تقفل الركبة تمامًا وأنت فوق": "Back flat on the pad. Lower until your knees are at about 90 degrees, and don't lock your knees at the top", "سكوات بالدمبل أمام الصدر": "Goblet squat", "امسك الدمبل عموديًا أمام صدرك. انزل بين ركبك وظهرك مستقيم، والكوعين يلمسون الركب من الداخل": "Hold the dumbbell upright at your chest. Sit down between your knees with a straight back, elbows brushing the inside of your knees", "طعن أمامي بالدمبل": "Dumbbell lunge", "خطوة واسعة للأمام وانزل حتى تقترب الركبة الخلفية من الأرض. ادفع بالقدم الأمامية وارجع. بدّل الرجلين": "Take a long step forward and lower until your back knee nearly touches the floor. Push through the front foot and step back. Alternate legs", "سكوات بلغاري بالدمبل": "Bulgarian split squat", "القدم الخلفية على مقعد. انزل عموديًا بالرجل الأمامية حتى يصير الفخذ موازي للأرض. العدات لكل رجل": "Back foot on a bench. Lower straight down on the front leg until your thigh is parallel to the floor. Reps are per leg", "رفعة رومانية بالبار": "Barbell Romanian deadlift", "خلفية الفخذ وأسفل الظهر": "Hamstrings & lower back", "ركب منثنية شوي وثابتة. ارجع بالحوض للخلف والبار ينزل ملاصق لرجلك حتى تحس بشد خلف الفخذ، ثم ادفع الحوض للأمام": "Knees slightly bent and fixed. Push your hips back as the bar slides down your legs until you feel a stretch in your hamstrings, then drive your hips forward", "الرفعة الميتة": "Deadlift", "الظهر كامل والأرجل": "Whole back & legs", "البار فوق منتصف القدم. ظهرك مستقيم وصدرك مرفوع. ادفع الأرض برجلك والبار ملاصق لجسمك حتى توقف مستقيم": "Bar over mid-foot. Back straight, chest up. Push the floor away with the bar close to your body until you stand tall", "رفعة رومانية بالدمبل": "Dumbbell Romanian deadlift", "نفس حركة الرومانية بالبار: الحوض للخلف والدمبلز تنزل قريبة من الساقين، والظهر مستقيم طول الوقت": "Same as the barbell version: hips back, dumbbells close to your shins, back straight the whole time", "دفع الحوض بالبار": "Barbell hip thrust", "أرداف": "Glutes", "أعلى ظهرك على المقعد والبار على الحوض مع وسادة. ادفع الحوض لفوق حتى يصير جسمك مستقيم، واعصر الأرداف ثانية": "Upper back on the bench, padded bar on your hips. Drive your hips up until your body is straight and squeeze your glutes for a second", "دفع الحوض بالدمبل": "Dumbbell hip thrust", "أعلى ظهرك على الكنب أو المقعد والدمبل على الحوض. ادفع لفوق واعصر الأرداف في الأعلى": "Upper back on a couch or bench, dumbbell on your hips. Drive up and squeeze your glutes at the top", "ثني الأرجل بالجهاز": "Leg curl machine", "خلفية الفخذ": "Hamstrings", "اثن ركبك بقوة وارجع ببطء خلال ثانيتين إلى ثلاث. لا ترفع الحوض عن المقعد": "Curl hard, then return slowly over two to three seconds. Keep your hips on the pad", "رفع السمانة بالجهاز": "Calf raise machine", "السمانة": "Calves", "انزل بالكعب لأقصى مدى وتمدد، ثم اطلع على أطراف أصابعك ووقف ثانية في الأعلى": "Lower your heels for a full stretch, then rise onto your toes and hold for a second at the top", "رفع السمانة بالدمبل": "Dumbbell calf raise", "قف على حافة درجة والدمبلز بيدك. انزل بالكعب واطلع لأعلى نقطة ببطء": "Stand on the edge of a step with dumbbells in hand. Lower your heels, then rise slowly to the top", "ضغط الصدر بالبار": "Barbell bench press", "صدر وترايسبس": "Chest & triceps", "لوحي الكتف مضمومين للخلف والقدمين ثابتة على الأرض. نزّل البار لأسفل الصدر بتحكم وادفعه لفوق": "Shoulder blades pinched back, feet planted. Lower the bar to your lower chest with control and press up", "ضغط الصدر بالدمبل": "Dumbbell bench press", "الدمبلز بمستوى الصدر والكوعين بزاوية مائلة مو مفتوحة. ادفع لفوق وقرّبهم بدون ما يتصادمون": "Dumbbells at chest level, elbows angled, not flared. Press up and bring them together without clashing", "ضغط صدر مائل بالدمبل": "Incline dumbbell press", "أعلى الصدر": "Upper chest", "المقعد مائل بزاوية ثلاثين تقريبًا. نفس طريقة ضغط الصدر بالدمبل مع التركيز على أعلى الصدر": "Bench at about 30 degrees. Same as the dumbbell press, focusing on the upper chest", "ضغط صدر مائل بالبار": "Incline barbell press", "المقعد مائل بزاوية ثلاثين. نزّل البار لأعلى الصدر تحت الترقوة وادفع بخط مستقيم": "Bench at 30 degrees. Lower the bar to your upper chest just below the collarbone and press straight up", "ضغط الأكتاف بالبار": "Barbell overhead press", "أكتاف": "Shoulders", "وقوف وشد البطن والأرداف. ادفع البار من أعلى الصدر لفوق رأسك مباشرة، وأدخل رأسك تحت البار في الأعلى": "Stand with abs and glutes tight. Press the bar from your upper chest straight overhead and push your head through at the top", "ضغط الأكتاف بالدمبل": "Dumbbell shoulder press", "جالس وظهرك مسنود. الدمبلز بمستوى الأذن وادفعها لفوق بدون ما تقوّس ظهرك": "Seated with back supported. Dumbbells at ear level, press up without arching your back", "رفرفة جانبي بالدمبل": "Dumbbell lateral raise", "جانبي الكتف": "Side delts", "ارفع الدمبلز للجانب حتى مستوى الكتف والكوع منثني شوي. انزل ببطء ولا تستخدم الزخم": "Raise the dumbbells out to shoulder height with a slight bend in your elbows. Lower slowly and don't swing", "تجديف بالبار": "Barbell row", "ظهر": "Back", "انحن للأمام بزاوية خمسة وأربعين والظهر مستقيم. اسحب البار لأسفل البطن واعصر لوحي الكتف": "Hinge forward to about 45 degrees with a straight back. Pull the bar to your lower stomach and squeeze your shoulder blades", "سحب أرضي بالكيبل": "Seated cable row", "وسط الظهر": "Mid back", "اجلس مستقيم واسحب المقبض لبطنك والصدر مرفوع. ارجع ببطء وخل كتفك يتمدد للأمام": "Sit tall and pull the handle to your stomach, chest up. Return slowly and let your shoulders stretch forward", "تجديف بالدمبل بيد واحدة": "One-arm dumbbell row", "يد وركبة على المقعد. اسحب الدمبل باتجاه الحوض مو الصدر، والكوع قريب من جسمك. العدات لكل يد": "Hand and knee on the bench. Pull the dumbbell toward your hip, not your chest, elbow close to your body. Reps are per arm", "سحب أمامي بالجهاز": "Lat pulldown", "عرض الظهر": "Lats", "قبضة أعرض من الكتف. اسحب البار لأعلى الصدر وأنت مايل للخلف شوي، وفكر إنك تسحب بالكوعين": "Grip wider than shoulders. Pull the bar to your upper chest while leaning back slightly; think of pulling with your elbows", "بلوفر بالدمبل": "Dumbbell pullover", "عرض الظهر والصدر": "Lats & chest", "استلق على المقعد والدمبل فوق صدرك. نزّله خلف رأسك بقوس والكوع منثني شوي، ثم رجّعه": "Lie on the bench with the dumbbell over your chest. Lower it behind your head in an arc, elbows slig function carryPick(sess,done){const out=[];sess.items.forEach((it,i)=>{if(it.carry)return;const dn=done[i].filter(Boolean).length;if(dn*2<it.sets)out.push({id:it.id,slot:it.slot,sets:it.sets-dn,tries:0})});return out}
function carryDate(){const L=S.carry||[];if(!L.length)return null;const lastK=L.reduce((m,c)=>c.from>m?c.from:m,'');
  for(let i=0;i<=14;i++){const d=addDays(sod(new Date()),i);const k=dkey(d);if(k<=lastK)continue;const it=weekState(weekOf(d)).sched[d.getDay()];if(it&&it.spec.kind==='iron'&&!it.done&&!S.logs[k])return d}
  return null}

  L.forEach(c=>{if(!EX[c.id]||x.items.some(it=>it.slot===c.slot))return;const it=itemFor(c.slot,c.id,x.w,x.dl);it.sets=Math.max(1,Math.min(it.sets,c.sets));it.carry=true;x.items.push(it)})}

function deriveCarry(){if(!S||!S.p)return;S.carry=S.carry||[];let ch=false;const nowK=dkey(new Date()),minK=dkey(addDays(new Date(),-3));
  for(const k in S.logs){const L=S.logs[k];if(!L||L.cc||k>=nowK||k<minK||L.kind!=='iron'||!L.sid||L.sid.indexOf(':')<0)continue;
    const [tpl,occ]=L.sid.split(':');if(!TPL[tpl])continue;L.cc=1;ch=true;

const RANK={light:0,ok:1,hard:2,fail:3};
function rollover(){
  const cw=weekOf(new Date());
  while(S.pw<cw){const w=S.pw;
    if(!isDeload(w)){const R=S.res[w]||{};
      for(const id in R){const st=R[id];const i=incOf(id);S.f[id]=S.f[id]||0;if(S.w[id]==null)continue;
        if(st==='fail'){S.f[id]++;if(S.f[id]>=2){S.w[id]=rnd(id,S.w[id]*.9);S.f[id]=0}}
        else{S.f[id]=0;
          if(st==='light'&&w>1)S.w[id]=rnd(id,S.w[id]+2*i);
          else if(st==='ok'||st==='light')S.w[id]=rnd(id,S.w[id]+i);}}}
    S.pw++}
  save()}

  let d=sod(new Date()),n=0,miss=0;const st=fromKey(S.p.start);
  for(let i=0;i<800;i++){if(d<st)break;const k=dkey(d);const L=S.logs[k];
    if(L){n++;miss=0}else if(isAwayKey(k)){/* غياب أو سفر: لا يحسب تفويت */}else if(isTrainDay(d)&&i>0){miss++;if(miss>=2)break}
    d=addDays(d,-1)}
  return n}

function musclesCard(){const r=readiness();const ws=weekSets();const lh=lastHit();const now=Date.now();

    <div class="mlist">${Object.keys(MG).map(g=>{const hrs=lh[g]?Math.round((now-lh[g])/36e5):null;
      return`<div><i style="background:${RC[r[g]]}"></i><span>${MG[g]}<br><small style="color:${['var(--acc-ink)','var(--warn)','var(--mut)'][r[g]]}">${RN[r[g]]}</small></span><small>${hrs===null?T('ما تمرنت','not trained'):hrs<48?T('قبل ','')+'<span class="num">'+hrs+'</span>'+T(' ساعة',' h ago'):T('قبل ','')+'<span class="num">'+Math.round(hrs/24)+'</span>'+T(' يوم',' d ago')}</small></div>`}).join('')}</div>
    <p class="hint">العضلة تحتاج تقريبًا من 48 إلى 72 ساعة تتعافى بعد التمرين.</p></div>`;
  h+=`<div class="card"><h3>الحجم الأسبوعي لكل عضلة</h3><p class="hint" style="margin:-4px 0 10px">المنطقة المظللة هي النطاق اللي تقول الأبحاث أنه الأفضل للبناء.</p>`;
  for(const g in MG){const v=ws[g];const[lo,hi]=MGT[g];const mx=hi*1.5;const st=v<lo?'تحت النطاق':v>hi?'فوق النطاق':'ضمن النطاق';

  return h+`</div>`}

/* ============ الحمل التدريبي ============ */
function sessLoad(L){return L.load||Math.round((L.rpe||6)*(L.dur||L.min||45))}
function loadStats(){const now=sod(new Date());let a=0,c=0;
  for(const k in S.logs){const d=(now-fromKey(k))/DAYMS;const l=sessLoad(S.logs[k]);if(d<7)a+=l;if(d<28)c+=l}
  const days=Math.round((now-fromKey(S.p.start))/DAYMS);const chronic=c/4;
  return{acute:a,chronic,ratio:chronic>0?a/chronic:0,ready:days>=21&&chronic>0,days}}
function loadCard(){const L=loadStats();
  let h=`<div class="card"><h3>الحمل التدريبي</h3>`;
  if(!L.ready){const p=Math.min(1,L.days/21);
    return h+`<p class="muted">نقارن حملك هذا الأسبوع بمعدلك في آخر 4 أسابيع، وننبهك لو قفز فجأة. يحتاج 3 أسابيع بيانات.</p>
      <div class="vtrk" style="margin-top:10px"><i class="val" style="width:${p*100}%;background:var(--cardio)"></i></div>
      <p class="hint">باقي <span class="num">${Math.max(0,21-L.days)}</span> يوم</p></div>`}
  const r=L.ratio;const zone=r<.8?[0,'أقل من معدلك','var(--mut)','تقدر تزيد شوي بأمان.']:r<=1.3?[1,'النطاق المثالي','var(--acc-ink)','حملك متوازن، كمّل كذا.']:r<=1.5?[2,'انتبه','var(--warn)','حملك أعلى من معدلك، لا تزيد أكثر هالأسبوع.']:[3,'خطر إجهاد','var(--bad)','حملك قفز فجأة، خفّف عشان ما تتعرض للإصابة.'];
  const pos=Math.min(100,r/2*100);
  return h+`<div class="lgauge"><i style="background:var(--s3);width:40%"></i><i style="background:var(--acc);width:25%"></i><i style="background:var(--warn);width:10%"></i><i style="background:var(--bad);width:25%"></i><b style="left:${pos}%"></b></div>
    <div class="vh" style="margin-top:8px"><span>النسبة <b class="num">${fmt(Math.round(r*100)/100)}</b></span><span style="color:${zone[2]};font-weight:700">${zone[1]}</span></div>
    <p class="muted" style="margin-top:4px">${zone[3]}</p><p class="hint">هذا مؤشر تستخدمه الأندية الاحترافية للتوجيه، مو قاعدة قطعية.</p></div>`}

function nextMilestone(){const V=achVals();let best=null;
  ACHL().forEach(a=>{const l=achLevel(a,V[a.k]);if(l>=a.lv.length)return;const prev=l?a.lv[l-1]:0;const next=a.lv[l];const p=(V[a.k]-prev)/(next-prev);
    if(!best||p>best.p)best={a,p,left:next-V[a.k],next}});return best}
function milestoneCard(){const m=nextMilestone();if(!m)return'';const a=m.a;const l=achLevel(a,achVals()[a.k]);
  const left=a.k==='ton'?fmt(Math.max(.1,Math.ceil(m.left*10)/10)):Math.ceil(m.left);
  return`<div class="mstone">${plateSVG(0,m.next,{size:52,p:m.p,pc:TIERC[Math.min(3,l)]})}<div class="mt"><span>${T('أقرب قرص','Next plate')}: ${L2(a.nm[l])}</span>
    <b>${T('باقي ','')}<span class="num">${left}</span> ${UNIT(a,Number(left))}${T('',' to go')}</b><small>${L2(a.t)}</small></div></div>`}
function slope(pts){if(pts.length<2)return null;const t0=pts[0].t;const xs=pts.map(p=>(p.t-t0)/DAYMS),ys=pts.map(p=>p.v);
  const n=xs.length,mx=xs.reduce((a,b)=>a+b)/n,my=ys.reduce((a,b)=>a+b)/n;let num=0,den=0;
  for(let i=0;i<n;i++){num+=(xs[i]-mx)*(ys[i]-my);den+=(xs[i]-mx)**2}
  if(den===0||xs[n-1]<7)return null;return num/den}

  return h+`</div></div>`}

let AWAYSTART=0,AWAYOPEN=false;
function awayCard(){const tk=dkey(new Date());const up=(S.away||[]).filter(k=>k>=tk).sort();
  const lab=n=>n===1?T('يوم','1 day'):n===2?T('يومين','2 days'):n===7?T('أسبوع','A week'):T(n+' أيام',n+' days');
  const head=`<button class="rowbtn" data-act="awaytoggle" aria-expanded="${AWAYOPEN}"><span class="rt"><b>${T('سفر أو ظرف طارئ؟','Travelling or something came up?')}</b><small>${up.length?T('أيام غياب: '+up.length,'Days away: '+up.length):T('رتّب جدولك حول أيام ما تقدر تتمرن فيها','Rearrange your plan around days you cannot train')}</small></span><span class="chev">›</span></button>`;
  if(!AWAYOPEN)return head;
  return head+`<div class="card"><div class="chips" style="margin-bottom:10px"><button class="chip ${AWAYSTART===0?'on':''}" data-act="awaystart" data-v="0">${T('من اليوم','From today')}</button><button class="chip ${AWAYSTART===1?'on':''}" data-act="awaystart" data-v="1">${T('من بكرة','From tomorrow')}</button></div>
    <p class="hint" style="margin:0 0 8px">${T('كم يوم ما تقدر تتمرن؟','How many days can you not train?')}</p>
    <div class="chips">${[1,2,3,5,7].map(n=>`<button class="chip" data-act="away" data-n="${n}" data-s="${AWAYSTART}">${lab(n)}</button>`).join('')}</div>
    ${up.length?`<p class="hint" style="margin-top:12px">${T('أيام الغياب (اضغط لإلغاء اليوم):','Away days (tap one to cancel it):')}</p><div class="awayrow">${up.map(k=>`<button class="chip ax" data-act="awayoff" data-k="${k}" aria-label="${T('ألغِ هذا اليوم','Cancel this day')}">${dstr(fromKey(k),{day:'numeric',month:'long'})} ×</button>`).join('')}</div>`:''}</div>`}
function renderWeek(){
  const w=weekOf(new Date());const ws=weekStart(new Date());const st=weekState(w);const tk=dkey(new Date());
  const b=Math.floor((w-1)/4);const nextSwap=(b+1)*4+1-w;let nextDl=w+1;while(!isDeload(nextDl))nextDl++;
  let h=header('جدول الأسبوع '+w,GOALS[S.p.goal]+'، '+S.p.days.length+' أيام تمرين',false);
  for(let i=0;i<7;i++){const d=addDays(ws,i);const k=dkey(d);const it=st.sched[i];const aw=isAwayKey(k);
    const missed=!it&&st.items.find(m=>m.baseDay===i&&!m.done&&!m.dropped&&!m.pre&&(i<st.f||st.noRoom.includes(m)));
    const s2=it?(it.spec.kind==='iron'?ironSession(it.spec.tpl,w,it.spec.occ):cardioSession(it.spec.ci,w)):null;
    const L=S.logs[k];const kind=it?it.spec.kind:'';
    let sub=aw?T('غياب','Away'):s2?esc(s2.title)+(it.moved?' · '+T('منقول من '+DAYS[it.baseDay],'Moved from '+DAYS[it.baseDay]):''):missed?(i<st.f?T('فات: ','Missed: '):T('ما لقيت مكان: ','No room: '))+esc(itemTitle(missed,w)):'راحة واستشفاء';
    h+=`<div class="wday ${k===tk?'is-today':''}"><button data-act="open" data-k="${i}" aria-expanded="${OPEN===i}">
      <span class="ic ${aw?'':kind}"><svg><use href="#i-${aw||!kind?'rest':kind}"/></svg></span>
      <span class="dn"><b>${DAYS[i]}</b><small>${sub}</small></span>
      <span class="ok">${L?'✓':''}</span></button>`;
    if(OPEN===i&&s2&&!aw){h+='<div class="det">';
      if(s2.kind==='iron')h+=`<div class="kv"><span>إحماء كارديو</span><b>${minsTxt(s2.warm)}</b></div>`;
      if(s2.kind==='cardio')h+=s2.lines.map(([l,v])=>`<div class="kv"><span>${esc(l)}</span><b>${esc(v)}</b></div>`).join('');
      s2.items.forEach(x=>{h+=`<div class="kv"><span>${EX[x.id].n}<br><small>${x.sets} مجموعات × ${x.reps} ${x.unit}</small></span><b>${x.w?'<span class="num">'+fmt(x.w)+'</span> كجم':''}</b></div>`});
      if(s2.kind==='iron'&&s2.fin)h+=`<div class="kv"><span>ختام كارديو${s2.fin.opt?'، اختياري':''}</span><b>${minsTxt(s2.fin.min)}</b></div>`;
      h+='</div>'}
    h+='</div>'}
  h+=`<div style="height:6px"></div>`+awayCard();
  h+=`<div class="card"><h3>خطة الدورة</h3>
    <div class="kv"><span>زيادة الأوزان</span><b>كل أحد حسب أدائك</b></div>
    <div class="kv"><span>تبديل التمارين</span><b>بعد ${nextSwap} ${plural(nextSwap,'أسبوع','أسابيع')}</b></div>
    <div class="kv"><span>أسبوع الاستشفاء</span><b>${isDeload(w)?'هذا الأسبوع':'بعد '+(nextDl-w)+' '+plural(nextDl-w,'أسبوع','أسابيع')}</b></div></div>`;
  save();return h}

function ACHL(){return ACH.filter(a=>S.p.eq==='walk'?!a.lift:!a.walkOnly)}
const L2=x=>Array.isArray(x)?x[LANG==='en'?1:0]:x;
const UNIT=(a,n)=>LANG==='en'&&n===1&&a.u[2]?a.u[2]:L2(a.u);
// لون القرص حسب المستوى: أخضر 10 ثم أصفر 15 ثم أزرق 20 ثم أحمر 25، وفوقها أحمر بحلقة ذهبية
const TIERC=['var(--p-green)','var(--p-yellow)','var(--p-blue)','var(--p-red)'];
function plateSVG(level,label,opt){opt=opt||{};const sz=opt.size||56;const locked=!level;const col=locked?'none':TIERC[Math.min(3,level-1)];const gold=level>=5;
  const p=opt.p;const R=25,C=2*Math.PI*29;
  return`<svg class="plate" width="${sz}" height="${sz}" viewBox="0 0 64 64" aria-hidden="true">
    ${p!==undefined?`<circle cx="32" cy="32" r="29" fill="none" stroke="var(--line)" stroke-width="3"/><circle cx="32" cy="32" r="29" fill="none" stroke="${opt.pc||'var(--flame)'}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${(C*Math.max(.02,p)).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 32 32)"/>`:''}
    <circle cx="32" cy="32" r="${R}" fill="${locked?'var(--surface2)':col}" ${locked?'stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="3 3"':''}/>
    ${gold&&!locked?`<circle cx="32" cy="32" r="${R-1.5}" fill="none" stroke="#F2C94C" stroke-width="2.5"/>`:''}
    <circle cx="32" cy="32" r="${R-7}" fill="none" stroke="${locked?'var(--line)':'rgba(255,255,255,.35)'}" stroke-width="1.5"/>
    <circle cx="32" cy="32" r="5" fill="var(--surface)"/>
    <text x="32" y="22" text-anchor="middle" font-size="11" font-weight="800" fill="${locked?'var(--muted)':'#fff'}" font-family="Barlow Condensed,IBM Plex Sans Arabic">${label}</text></svg>`}
function fullWeeks(){const cw=weekOf(new Date());const st=weekStart(fromKey(S.p.start));let n=0;
  for(let w=1;w<=cw;w++){const ws=addDays(st,(w-1)*7);let c=0;for(let j=0;j<7;j++)if(S.logs[dkey(addDays(ws,j))])c++;if(c>=S.p.days.length)n++}return n}
function achVals(){const L=Object.values(S.logs);
  return{n:L.length,best:Math.max(S.best||0,streak()),ton:L.reduce((a,l)=>a+(l.vol||0),0)/1000,cmin:L.reduce((a,l)=>a+(l.min||0),0),pr:S.prc||0,wk:fullWeeks(),km:L.reduce((a,l)=>a+(l.km||0),0)}}
function achLevel(a,v){let l=0;while(l<a.lv.length&&v>=a.lv[l])l++;return l}
function achCard(a,v){const l=achLevel(a,v);const max=l>=a.lv.length;const prev=l?a.lv[l-1]:0;const next=max?a.lv[a.lv.length-1]:a.lv[l];
  const p=max?1:Math.max(0,Math.min(1,(v-prev)/(next-prev)));const left=next-v;
  const lft=a.k==='ton'?fmt(Math.max(.1,Math.ceil(left*10)/10)):Math.ceil(left);
  const cur=l?L2(a.nm[l-1]):T('ما بدأت','Not started');const nx=max?'':L2(a.nm[l]);
  return`<div class="ach2">${plateSVG(l,l?a.lv[l-1]:'—')}
    <div class="ab"><small>${L2(a.t)}</small><b>${cur}</b>
      <div class="vtrk"><i class="val" style="width:${Math.max(3,p*100)}%;background:${TIERC[Math.min(3,l)]}"></i></div>
      <span>${max?T('جمعت كل الأقراص هنا','You collected every plate here'):T('باقي ','')+'<b class="num">'+lft+'</b> '+UNIT(a,Math.ceil(left))+T(' على «'+nx+'»',' to «'+nx+'»')}</span></div>
    ${max?'':`<div class="anext">${plateSVG(0,next,{size:34})}</div>`}</div>`}

  // وزن الجسم

  for(let i=0;i<n;i++){const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.connect(g);g.connect(AC.destination);
    const t=AC.currentTime+i*(d+.08);g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d)}}catch(e){}
  try{navigator.vibrate&&navigator.vibrate(n>1?[200,100,200]:200)}catch(e){}}

  switch(act){
    case'f':readForm();F[t.dataset.k]=t.dataset.v;if(F.eq==='walk'&&(F.goal==='muscle'||F.goal==='strength'))F.goal='fitness';render();break;
    case'fday':{readForm();const v=+t.dataset.v;if(F.days.includes(v))F.days=F.days.filter(x=>x!==v);else if(F.days.length<6)F.days.push(v);render();break}
    case'fsave':{readForm();const err=document.getElementById('fErr');const bw=parseFloat(F.bw),age=parseInt(F.age);
      if(!F.name){err.textContent=tr('اكتب اسمك.');return}
      if(!(bw>=30&&bw<=250)){err.textContent=tr('اكتب وزنك بين 30 و 250 كيلو.');return}
      if(!(age>=12&&age<=90)){err.textContent=tr('اكتب عمرك بين 12 و 90.');return}
      if(F.days.length<2){err.textContent=tr('اختر يومين تمرين على الأقل.');return}
      F.bw=bw;F.age=age;
      if(S&&S.p){const ch=S.p.level!==F.level||S.p.sex!==F.sex||Math.abs(S.p.bw-bw)>=5||S.p.goal!==F.goal||S.p.eq!==F.eq;
        const fin=reset=>{S.p={...S.p,...F};if(reset){S.w={};S.w0={};S.f={}}S.act=null;F=null;TAB='today';save();render();scrollTo(0,0)};
        if(ch)uiDialog(T('غيّرت بيانات تأثر على الأوزان. أعيد حساب أوزان البداية؟','You changed details that affect your weights. Recalculate your starting weights?'),{confirm:1,yes:T('أعد الحساب','Recalculate'),no:T('أبقِ أوزاني','Keep my weights'),onYes:()=>fin(true),onNo:()=>fin(false)});
        else fin(false);
        break}
      S={p:{...F,start:dkey(new Date())},w:{},w0:{},f:{},res:{},h:{},logs:{},swaps:{},act:null,pw:1,best:0,theme:'dark',themeV:2,lang:LANG,pr:{},prc:0,bwlog:[{d:dkey(new Date()),w:bw}]};
      F=null;TAB='today';save();render();scrollTo(0,0);break}
    case'fcancel':F=null;TAB='settings';render();break;
    case'set':{if(fastTap('set'+i+'_'+t.dataset.j))break;const a=ensureAct();const j=+t.dataset.j;a.done[i][j]=!a.done[i][j];if(!a.t0)a.t0=Date.now();a.t1=Date.now();if(a.done[i].every(Boolean))XO=undefined;keepAwake(true);save();
      if(a.done[i][j]){const it=a.sess.items[i];const lastSet=a.done[i].every(Boolean);const lastEx=a.done.every(d=>d.every(Boolean));
        if(!lastEx){let nx='';if(lastSet){const k=a.done.findIndex(d=>!d.every(Boolean));nx=k>=0?'التالي: '+EX[a.sess.items[k].id].n:''}else nx='المجموعة '+(j+2)+' من '+it.sets;
          startRest(it.rest,tr(nx))}}
      render();break}
    case'rate':{const a=ensureAct();a.rate[i]=t.dataset.v;save();render();break}
    case'cue':CUE.has(i)?CUE.delete(i):CUE.add(i);render();break;
    case'wplus':case'wminus':{const a=ensureAct();const it=a.sess.items[i];const inc=incOf(it.id);const d=act==='wplus'?inc:-inc;
      it.w=rnd(it.id,it.w+d);S.w[it.id]=rnd(it.id,S.w[it.id]+d);save();render();break}
    case'swap':{const a=ensureAct();const it=a.sess.items[i];const L=SLOTS[it.slot][eqKey()];
      const nid=L[(L.indexOf(it.id)+1)%L.length];S.swaps[it.slot+'@'+Math.floor((a.w-1)/4)]=nid;
      const ni=itemFor(it.slot,nid,a.w,a.sess.dl);a.sess.items[i]=ni;a.done[i]=Array(ni.sets).fill(false);delete a.rate[i];
      CUE.delete(i);save();render();break}
    case'cswap':{const a=ensureAct();const L=machList();const cur=a.sess.mach;const nm=L[(L.indexOf(cur)+1)%L.length];
      a.sess=cardioSession(a.sess.ci||0,a.w,a.sess.ctype==='light'?'light':(a.sess.ctype==='incline'?'zone2':a.sess.ctype),nm);
      a.done=a.sess.items.map(it=>Array(it.sets).fill(false));save();render();break}
    case'away':{const n=+t.dataset.n,sd=+t.dataset.s;S.away=S.away||[];
      for(let i=0;i<n;i++){const k=dkey(addDays(new Date(),sd+i));if(!S.away.includes(k))S.away.push(k)}
      S.away=S.away.slice(-60);if(sd===0&&S.act&&!S.act.t0)S.act=null;save();render();break}
    case'awayoff':S.away=(S.away||[]).filter(k=>k!==t.dataset.k);save();render();break;
    case'awaystart':AWAYSTART=+t.dataset.v;render();break;
    case'sdrop':{const w=weekOf(new Date());S.drop=S.drop||[];S.drop.push(w+':'+t.dataset.sid);S.drop=S.drop.slice(-80);if(S.act&&S.act.sess&&S.act.sess.sid===t.dataset.sid&&!S.act.t0)S.act=null;save();render();break}
    case'sdropall':{const w=weekOf(new Date());const st=weekState(w);S.drop=S.drop||[];
      st.items.filter(it=>!it.done&&!it.dropped&&!it.pre&&(it.baseDay<st.f||st.noRoom.includes(it))).forEach(it=>S.drop.push(w+':'+it.sid));
      S.drop=S.drop.slice(-80);if(S.act&&!S.act.t0)S.act=null;save();render();break}
    case'psave':{const i=+t.dataset.i;const pa=(S.pendAct||[])[i];if(!pa)break;
      if(S.logs[pa.date]){S.pendAct.splice(i,1);save();render();uiDialog(T('فيه تمرين مسجل لنفس اليوم، فما أقدر أضيف هذا فوقه.','There is already a workout logged for that day, so I cannot add this one on top.'));break}
      ACT_OVR=pa;OVAT=Date.now();document.getElementById('feelOv').classList.add('show');break}
    case'pdrop':{const i=+t.dataset.i;uiDialog(T('تتجاهل هذا التمرين نهائيًا؟','Discard this workout for good?'),{confirm:1,yes:T('تجاهله','Discard'),no:T('رجوع','Back'),onYes:()=>{(S.pendAct||[]).splice(i,1);save();render()}});break}
    case'xopen':{const i=+t.dataset.i;const a0=S.act&&S.act.date===dkey(new Date())?S.act:null;const auto=a0&&a0.t0?firstOpen(a0):-1;const cur=XO===undefined?auto:XO;XO=cur===i?-1:i;render();break}
    case'alx':ALX=!ALX;render();break;
    case'gotab':TAB=t.dataset.to;OPEN=null;ANIM=true;render();scrollTo(0,0);break;
    case'reloadapp':location.reload();break;
    case'carrytoday':carryToday();scrollTo(0,0);break;
    case'carrydrop':S.carry=[];if(S.act&&S.act.sess&&!S.act.t0&&S.act.sess.items.some(i=>i.carry))S.act=null;save();render();break;
    case'awaytoggle':AWAYOPEN=!AWAYOPEN;render();break;
    case'finish':if(fastTap('fin',900))break;finish();break;
    case'zoom':{const k=t.dataset.k;const nm=EX[k]?EX[k].n:(MN[k]||'');
      document.getElementById('zoomBox').innerHTML=tr(`${photo(k,'nz zbig')}<p class="zcap">${nm}</p><p class="zhint">${T('اضغط في أي مكان للإغلاق','Tap anywhere to close')}</p>`);
      document.getElementById('zoomOv').classList.add('show');break}
    case'zclose':document.getElementById('zoomOv').classList.remove('show');break;
    case'lang':LANG=t.dataset.v;if(S){S.lang=LANG;save()}applyLang();render();break;
    case'gt':GT=t.dataset.v;render();break;
    case'gedit':GOALEDIT=true;GT=S.goal?S.goal.t:'ex';render();break;
    case'gcancel':GOALEDIT=false;render();break;
    case'gsave':{const v=parseFloat(document.getElementById('gVal').value);if(!(v>0)){uiDialog(T('اكتب الرقم المستهدف.','Enter the target number.'));break}
      if(GT==='bw'){const bl=S.bwlog||[];const cur=bl.length?bl[bl.length-1].w:S.p.bw;S.goal={t:'bw',target:v,from:cur}}
      else{const id=document.getElementById('gEx')&&document.getElementById('gEx').value;if(!id){uiDialog(T('خلّص أول تمرين أوزان عشان تختار تمرين.','Finish your first lifting workout to choose an exercise.'));break}S.goal={t:'ex',id,target:v,from:S.w[id]||0}}
      GOALEDIT=false;save();render();break}
    case'start':openFocus();break;
    case'focus':openFocus();break;
    case'fclose':closeFocus();break;
    case'fnext':FOC=Math.min(FOC+1,S.act.sess.items.length-1);render();document.getElementById('focusOv').scrollTo(0,0);break;
    case'fprev':FOC=Math.max(0,FOC-1);render();document.getElementById('focusOv').scrollTo(0,0);break;
    case'ffinish':closeFocus();finish();break;
    case'feel':if(ovFast())break;commitFinish(t.dataset.v);break;
    case'feelCancel':ACT_OVR=null;document.getElementById('feelOv').classList.remove('show');break;
    case'ctimer':{const a=ensureAct();if(!a.t0)a.t0=Date.now();keepAwake(true);startTimer({phases:[{l:t.dataset.l,s:+t.dataset.m*60,c:'calm'}]},t.dataset.f);break}
    case'timer':{const a=ensureAct();if(!a.t0)a.t0=Date.now();keepAwake(true);startTimer(a.sess);break}
    case'tmPause':{if(!TM)break;if(TM.paused){TM.end=Date.now()+TM.left;TM.paused=false;t.textContent=T('إيقاف مؤقت','Pause')}else{TM.left=TM.end-Date.now();TM.paused=true;t.textContent=T('استئناف','Resume')}break}
    case'tmStop':tmDone(false);break;
    case'rest15':if(ovFast())break;if(REST_T)REST_T.end+=15000;break;
    case'restSkip':if(ovFast())break;stopRest();break;
    case'closeCeleb':if(ovFast())break;document.getElementById('celebOv').classList.remove('show');break;
    case'extra':S._extra=dkey(new Date());S.act=null;ensureAct();save();render();break;
    case'open':{const k=+t.dataset.k;OPEN=OPEN===k?null:k;render();break}
    case'edit':TAB='edit';F=null;render();scrollTo(0,0);break;
    case'theme':S.theme=t.dataset.v;applyTheme();save();render();break;
    case'sound':S.sound=t.dataset.v==='1';save();render();break;
    case'bwsave':{const v=parseFloat(document.getElementById('bwIn').value);if(!(v>=30&&v<=250)){uiDialog(T('اكتب وزن بين 30 و 250.','Enter a weight between 30 and 250 kg.'));break}
      S.bwlog=S.bwlog||[];const k=dkey(new Date());if(S.bwlog.length&&S.bwlog[S.bwlog.length-1].d===k)S.bwlog.pop();S.bwlog.push({d:k,w:v});S.p.bw=v;save();render();break}
    case'export':{const txt=JSON.stringify(S);const fn='madrabi-'+dkey(new Date())+'.json';
      const mark=()=>{S.lastBackup=Date.now();S.bkSnooze=0;save();render()};
      const dl=()=>{const bl=new Blob([txt],{type:'application/json'});const u=URL.createObjectURL(bl);const l=document.createElement('a');
        l.href=u;l.download=fn;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);mark()};
      try{const f=new File([txt],fn,{type:'application/json'});
        if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f],title:'Madrabi backup'}).then(mark).catch(e=>{if(!e||e.name!=='AbortError')dl()});
        else dl()}catch(e){dl()}
      break}
    case'bksnooze':S.bkSnooze=Date.now()+3*DAYMS;save();render();break;
    case'import':document.getElementById('impFile').click();break;
    case'reset':uiDialog(T('أكيد؟ بتنمسح كل تمارينك وأوزانك.','Are you sure? All your workouts and weights will be erased.'),{confirm:1,yes:T('امسح','Erase'),onYes:()=>{try{localStorage.removeItem(LS)}catch(e){}S=null;F=null;TAB='today';render()}});break;
  }
});
document.addEventListener('change',e=>{if(e.target.id!=='impFile')return;const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!d.p||!d.w)throw 0;S=d;migrate();if(S.lang)LANG=S.lang;save();applyLang();applyTheme();TAB='today';render();uiDialog(T('تم استرجاع بياناتك.','Your data has been restored.'))}catch(err){uiDialog(T('الملف غير صالح. اختر ملف النسخة الاحتياطية اللي حمّلته من التطبيق.','Invalid file. Choose the backup file you downloaded from the app.'))}};r.readAsText(f)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S&&S.p){archiveStale();deriveCarry();rollover();render();if(S.act&&S.act.t0&&S.act.date===dkey(new Date()))keepAwake(true)}});

/* ============ التشغيل ============ */
S=load();
if(S&&S.p){migrate();deriveCarry();if(S.lang)LANG=S.lang;rollover()}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
applyLang();applyTheme();render();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
setTimeout(()=>(window.requestIdleCallback||(f=>f()))(prefetchPhotos),4000);
if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',ev=>{if(ev.data&&ev.data.type==='updated'){UPDREADY=true;if(TAB==='today')render()}});
</script>
</body>
